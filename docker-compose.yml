version: '3.8'

services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo:27017/test --quiet
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
  # localstack:
  #   image: localstack/localstack:latest
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - SERVICES=s3
  #     - DEFAULT_REGION=us-east-1
  #     - AWS_ACCESS_KEY_ID=test
  #     - AWS_SECRET_ACCESS_KEY=test
  #   volumes:
  #     - localstack_data:/tmp/localstack

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env   # Ensure this line is included
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      # - AWS_ENDPOINT_URL=http://localstack:4566
      # - AWS_ACCESS_KEY_ID=test
      # - AWS_SECRET_ACCESS_KEY=test
      # - AWS_DEFAULT_REGION=us-east-1
    depends_on:
      - mongodb
      # - localstack

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - REACT_APP_API_URL=http://localhost:8000/api
  #   depends_on:
  #     - backend

volumes:
  mongodb_data:
  # localstack_data: