service: ecommerce-background-tasks

frameworkVersion: '3'

provider:
  name: aws
  runtime: python3.9
  region: us-east-1
  memorySize: 256
  timeout: 30
  environment:
    MONGO_URI: ${env:MONGO_URI}
    DB_NAME: ${env:DB_NAME, 'ecommerce'}
    SNS_TOPIC_ARN: !Ref OrdersNotificationTopic
    S3_BUCKET: !Ref ReportsBucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sns:Publish
          Resource: !Ref OrdersNotificationTopic
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource: !Join ['', ['arn:aws:s3:::', !Ref ReportsBucket, '/*']]

functions:
  processOrders:
    handler: handler.lambda_handler
    events:
      # Schedule daily sales report generation
      - schedule:
          rate: cron(0 1 * * ? *)  # Run at 1 AM UTC every day
          enabled: true
          input:
            detail-type: "Scheduled Event"
      # HTTP endpoint for manual triggering
      - httpApi:
          path: /tasks
          method: post
      # EventBridge integration with MongoDB trigger
      - eventBridge:
          eventBus: default
          pattern:
            source:
              - aws.events
            detail-type:
              - MongoDB Change
            detail:
              eventType:
                - INSERT
              operationType:
                - insert
              ns:
                db:
                  - ${env:DB_NAME, 'ecommerce'}
                coll:
                  - orders

resources:
  Resources:
    OrdersNotificationTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ecommerce-orders-notifications
        Handler: handler.process_new_order
        
    ReportsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ecommerce-reports-${opt:stage, 'dev'}-${aws:accountId}
        
plugins:
  - serverless-python-requirements

custom:
  pythonRequirements:
    dockerizePip: true
    fileName: requirements.txt